# /etc/mdev.conf - FreeLinX Device Permissions and Hotplug Rules
# Syntax: <device regex> <uid>:<gid> <octal permissions> [=path] [@|$|* command]
# Numeric GIDs: 5=tty, 6=disk, 29=audio, 44=video, 97=input

# Direct Rendering Manager (DRM / KMS / GPU 3D acceleration)
dri/card[0-9]*      0:44 0660
dri/renderD[0-9]*   0:44 0666
fb[0-9]*            0:44 0660

# Audio / ALSA soundcards (gid 29)
snd/.*              0:29 0660

# Input devices (gid 97: keyboards, mice, touchpads, gamepads)
input/.*            0:97 0660

# Consoles & Terminals (gid 5)
#
# /dev/tty and /dev/console come out of the catch-all below as 0660 root:root,
# which is wrong in both directions: a normal user cannot open /dev/tty at all,
# and anyone on the machine can scribble on the console.  The kernel's own
# 0666 root:root and 0600 root:tty are the permissions that were wanted here.
# The virtual terminals use "+" and not "*" because "[0-9]*" is zero or more, so
# "tty[0-9]*" also answers for the bare name "tty" and /dev/tty would take the
# console's 0660 instead of its own.
tty                 0:0 0666
tty[0-9]+           0:5 0660
ttyS[0-9]+          0:5 0660
console             0:5 0600
ptmx                0:5 0666
pts/[0-9]+          0:5 0620

# /dev/kmsg world-readable is the vulnerability a distribution spent years
# closing, and the catch-all would reopen it on every boot.
kmsg                0:5 0660

# The nodes the kernel itself asks for.  devtmpfs creates these before mdevd
# starts, and mdevd chmods a node that already exists, so a device with no rule
# here ends up with the catch-all's 0660 root:root.  That is how /dev/null came
# out unwritable for a normal user: the first "cmd >/dev/null" in /etc/profile
# died on it and the login never finished.  A node nobody here names a rule for
# is a node whose permissions get decided by that default instead of by us.
null                0:0 0666
zero                0:0 0666
full                0:0 0666
random              0:0 0666
urandom             0:0 0666
shm                 0:0 0666

# Storage devices & Removable Media Auto-Mounting (gid 6)
sd[a-z][0-9]*       0:6 0660 */sbin/flxautomount
vd[a-z][0-9]*       0:6 0660 */sbin/flxautomount
nvme[0-9]*n[0-9]*p[0-9]* 0:6 0660 */sbin/flxautomount
mmcblk[0-9]*p[0-9]* 0:6 0660 */sbin/flxautomount

# Optical media.  Without a rule here devtmpfs still makes /dev/sr0, but nothing
# ever calls flxautomount for it, so the disc you booted from is only mounted if
# /init finds it by volume id - and a disc inserted later, which is the case
# that matters when the machine booted from a USB stick, is not mounted at all.
sr[0-9]*            0:6 0660 */sbin/flxautomount
scd[0-9]*           0:6 0660 */sbin/flxautomount

# Driver Auto-Probing for newly connected hardware
#
# mdevd walks the rules in order and stops at the first one that matches the
# whole device name, so this has to be last: a rule below it is dead text.  It
# spells out mdevd's own built-in default (0660 root:root) because the command
# is the reason for having the rule at all, and a rule without a mode would let
# mdevd's default stand anyway.
.*                  0:0 0660 @/sbin/flxdriverhotplug
