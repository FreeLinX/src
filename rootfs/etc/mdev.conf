# /etc/mdev.conf - FreeLinX Device Permissions and Hotplug Rules
# Syntax: <device regex> <uid>:<gid> <octal permissions> [=path] [@|$|* command]
# Numeric GIDs: 5=tty, 6=disk, 29=audio, 44=video, 97=input

# Direct Rendering Manager (DRM / KMS / GPU 3D acceleration)
dri/card[0-9]*      0:44 0660
dri/renderD[0-9]*   0:44 0666
fb[0-9]*            0:44 0660

# Audio / ALSA soundcards (gid 29)
snd/.*              0:29 0660

# Input devices (gid 97: keyboards, mice, touchpads, gamepads)
input/.*            0:97 0660

# Consoles & Terminals (gid 5)
tty[0-9]*           0:5 0660
ttyS[0-9]*          0:5 0660
ptmx                0:5 0666

# Storage devices & Removable Media Auto-Mounting (gid 6)
sd[a-z][0-9]*       0:6 0660 */sbin/flxautomount
vd[a-z][0-9]*       0:6 0660 */sbin/flxautomount
nvme[0-9]*n[0-9]*p[0-9]* 0:6 0660 */sbin/flxautomount
mmcblk[0-9]*p[0-9]* 0:6 0660 */sbin/flxautomount

# Driver Auto-Probing for newly connected hardware
.*                  0:0 0660 @/sbin/flxdriverhotplug
