# /etc/doas.conf: FreeLinX privilege elevation rules.  See doas.conf(5).
# SPDX-License-Identifier: ISC
#
# Members of wheel can run commands as root, after their own password.
# xsetup's setup-user and flxadduser --admin are what put a user in wheel.

permit persist :wheel

# Power control without a password for wheel, by full path only.
permit nopass :wheel cmd /sbin/reboot
permit nopass :wheel cmd /sbin/poweroff
permit nopass :wheel cmd /usr/bin/zzz

# live ISO session user: administrator without a password (removed by the installer)
permit nopass keepenv live
