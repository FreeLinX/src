# /etc/doas.conf: FreeLinX Privilege Elevation Rules
# SPDX-License-Identifier: ISC
#
# Syntax: permit|deny [options] identity [as target] [cmd command [args ...]]
# Members of the 'wheel' group can run commands as root.

permit persist :wheel

# Allow passwordless system power control and hardware management for wheel
permit nopass :wheel cmd reboot
permit nopass :wheel cmd poweroff
permit nopass :wheel cmd /sbin/reboot
permit nopass :wheel cmd /sbin/poweroff
# the login screen's power menu (F12) runs as the greeter user
permit nopass greeter cmd /sbin/reboot
permit nopass greeter cmd /sbin/poweroff
permit nopass :wheel cmd zzz
permit nopass :wheel cmd ZZZ
permit nopass :wheel cmd flxpower
permit nopass :wheel cmd flxdriver
# network settings from the desktop: only the display passes through (keepenv
# would hand GTK_MODULES / LD_PRELOAD to a root process without a password)
permit nopass setenv { DISPLAY XAUTHORITY } :wheel cmd /usr/bin/flxnetmgr
# software installation from the desktop (Packages)
permit nopass setenv { DISPLAY XAUTHORITY } :wheel cmd /usr/bin/flxpkg
# live ISO session user: administrator without a password (removed by the installer)
permit nopass keepenv live
