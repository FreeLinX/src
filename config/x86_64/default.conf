# FreeLinX default configuration for x86_64.
#
# This is a POSIX shell fragment sourced by scripts/common.sh. Values use the
# ${VAR:-default} idiom so that FREELINX_* environment variables set before
# running a script take precedence over this file.
#
# Relative defaults are resolved against the repository root (FREELINX_ROOT);
# no absolute, user-specific paths are hard-coded.

# Target architecture and ABI triple.
FREELINX_ARCH=${FREELINX_ARCH:-x86_64}
FREELINX_TRIPLE=${FREELINX_TRIPLE:-x86_64-linux-musl}

# External repositories. Defaults are the sibling directories of this
# repository (FreeLinX/). Each can be overridden via environment variables.
FREELINX_KERNEL_DIR=${FREELINX_KERNEL_DIR:-"${FREELINX_ROOT}/../kernel"}
FREELINX_TOOLCHAIN_DIR=${FREELINX_TOOLCHAIN_DIR:-"${FREELINX_ROOT}/../toolchain"}
FREELINX_PORTS_DIR=${FREELINX_PORTS_DIR:-"${FREELINX_ROOT}/../ports"}
FREELINX_ISO_DIR=${FREELINX_ISO_DIR:-"${FREELINX_ROOT}/../iso"}

# Output directory of the toolchain repo. Override when the bootstrapped
# compiler/linker live elsewhere (e.g. ./build/tools/bin).
FREELINX_TOOLCHAIN_BIN=${FREELINX_TOOLCHAIN_BIN:-"${FREELINX_TOOLCHAIN_DIR}/bin"}

# Toolchain sysroot (musl). Consumed by clang via --sysroot.
FREELINX_SYSROOT=${FREELINX_SYSROOT:-"${FREELINX_TOOLCHAIN_DIR}/x86_64-linux-musl"}

# Source tree layout of this repository.
FREELINX_ROOTFS_DIR=${FREELINX_ROOTFS_DIR:-"${FREELINX_ROOT}/rootfs"}
FREELINX_SCRIPT_DIR=${FREELINX_SCRIPT_DIR:-"${FREELINX_ROOT}/scripts"}

# Build output. Everything generated lives under the build directory so the
# repository stays source-oriented.
FREELINX_BUILD_DIR=${FREELINX_BUILD_DIR:-"${FREELINX_ROOT}/build"}
FREELINX_ARTIFACT_DIR=${FREELINX_ARTIFACT_DIR:-"${FREELINX_BUILD_DIR}/${FREELINX_ARCH}"}

# Staging root filesystem produced by the build.
FREELINX_STAGE_ROOTFS=${FREELINX_STAGE_ROOTFS:-"${FREELINX_ARTIFACT_DIR}/rootfs"}

# Number of parallel jobs for external builds (used only once the ports
# system is integrated).
FREELINX_JOBS=${FREELINX_JOBS:-1}